source_reviews:
  ea_mission_editor:
    repository: "https://github.com/electronicarts/CNC_TS_and_RA2_Mission_Editor"
    commit: "6abf0f557469baea73079c6bf6550709e2e3584e"
    license: "GPL-3.0-or-later"
    reference_only: true
    code_imported: false
    reference_files:
      - "MissionEditor/IniFile.cpp"
      - "MissionEditor/IniFile.h"
      - "MissionEditor/Loading.cpp"
      - "MissionEditor/MapData.cpp"
    observations:
      - "The reader truncates its semantic view at the first semicolon and uses the first equals separator."
      - "RA2/YR and map load paths request trimming of key and value views."
      - "Repeated sections merge and repeated keys overwrite in the editor map model."
      - "Its writer sorts and reformats data, so it is not an identity-writer model."
  openra:
    repository: "https://github.com/OpenRA/OpenRA"
    commit: "a520984d91eda9de48a62b1d15c1e3bad0d4fb1a"
    license: "GPL-3.0-or-later"
    reference_only: true
    code_imported: false
    reference_file: "OpenRA.Mods.Common/FileFormats/IniFile.cs"
    observations:
      - "The reader recognizes leading-bracket sections, truncates entries at the first semicolon, trims fields, and uses the first equals separator."
      - "It treats a no-equals line as an empty-valued key, merges case-folded sections, and keeps the first repeated key."
  xcc_fixed_references:
    sourceforge_revision: "r1201"
    sourceforge_archive_sha256: "82B699522282404A32FF33F816D2B8B4219CE8363F09075F1DDDC3ADA94270CF"
    omniblade_commit: "62bb77080f13bdf65c79c84837b7cc264bdd432d"
    license: "GPL-2.0-only"
    reference_only: true
    code_imported: false
    ini_grammar_conclusion: "No additional byte-preserving RA2/YR INI grammar was established from the pinned XCC references."

conservative_structure_policy:
  punctuation_basis: "ASCII bytes or BOM-selected UTF-16 code units"
  blank: "empty or ASCII-space/tab-only physical content"
  full_line_comment: "first non-space unit is semicolon"
  section: "leading bracket after ASCII space/tab, closing bracket, and only whitespace or semicolon tail"
  key_value: "nonempty key and first equals inside a current nonempty section"
  inline_semicolon_removed: false
  inline_semicolon_semantics_confirmed_for_original_yr: false
  inline_semicolon_diagnostic: "AmbiguousInlineSemicolon"
  opaque_cases:
    - "key outside section"
    - "line without equals"
    - "unterminated section"
    - "empty section"
    - "unresolved section trailing content"
    - "unsupported control character"
    - "nonstandard MOD extension"
  duplicate_sections_preserved: true
  duplicate_keys_preserved: true
  duplicate_winner_selected: false

evidence_conflicts:
  no_equals_line: "FA2 ignores; OpenRA models an empty-valued key"
  duplicate_key: "FA2 map overwrites; OpenRA keeps the first"
  section_position: "FA2 searches for brackets; OpenRA requires bracket at character zero"
  case_and_lookup: "Observed implementations differ and do not establish original YR runtime behavior"
  consequence: "Preserve bytes and classify unresolved forms as opaque or ambiguous"

encoding_policy:
  bomless: "RawSingleByte; no UTF-8 or host-code-page inference"
  utf8_bom: "preserve BOM and validate with strict no-replacement UTF-8"
  utf16le_bom: "preserve BOM, require complete little-endian code units, and scan syntax as code units"
  utf16be_bom: "preserve BOM, require complete big-endian code units, and scan syntax as code units"
  encoding_default_allowed: false
  windows_acp_allowed: false
  current_culture_allowed: false
  decoder_replacement_allowed: false
  unicode_normalization_performed: false
  runtime_code_page_selected: false

